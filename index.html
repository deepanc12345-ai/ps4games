<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Game Details</title>

<style>

body{
 margin:0;
 background:#090b0f;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 background:linear-gradient(135deg,#0757c9,#1680ed);
 padding:35px 20px;
 text-align:center;
}

.container{
 max-width:850px;
 margin:auto;
 padding:25px 18px;
}

.back{
 display:inline-block;
 background:#1769e0;
 color:white;
 text-decoration:none;
 padding:11px 16px;
 border-radius:9px;
 margin-bottom:20px;
}

.card{
 background:#15181d;
 border:1px solid #303743;
 border-radius:16px;
 padding:25px;
}

h1{
 color:#58aaff;
}

.badge{
 display:inline-block;
 background:#29456e;
 padding:8px 12px;
 border-radius:8px;
}

.info{
 color:#c9d1dc;
 line-height:1.7;
}

.official{
 display:inline-block;
 background:#1769e0;
 color:white;
 text-decoration:none;
 padding:12px 16px;
 border-radius:9px;
 margin-top:10px;
}

</style>

</head>

<body>

<header>

<h1>🎮 Game Details</h1>

<p>PlayStation Game Information</p>

</header>

<div class="container">

<a class="back" href="index.html">
← Back to Games
</a>

<div class="card">

<span id="platform" class="badge"></span>

<h1 id="name"></h1>

<p class="info">
Release Year:
<strong id="year"></strong>
</p>

<hr>

<h2>About the Game</h2>

<p class="info">
Explore information about this PlayStation game,
including its platform and release details.
</p>

<h2>Platform</h2>

<p id="platform2" class="info"></p>

<h2>Release Year</h2>

<p id="year2" class="info"></p>

<a id="official"
class="official"
target="_blank"
rel="noopener">

🔎 Search Official Info →

</a>

</div>

</div>

<script>

const params=
new URLSearchParams(location.search);

const name=
params.get("name") || "Game";

const platform=
params.get("platform") || "PlayStation";

const year=
params.get("year") || "Not listed";

document.getElementById("name")
.textContent=name;

document.getElementById("platform")
.textContent=platform;

document.getElementById("platform2")
.textContent=platform;

document.getElementById("year")
.textContent=year;

document.getElementById("year2")
.textContent=year;

document.getElementById("official").href=
"https://www.google.com/search?q="+
encodeURIComponent(name+" "+platform+" official");

</script>

</body>

</html>
