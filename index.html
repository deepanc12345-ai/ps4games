<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Console Games</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080a0e;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  background:linear-gradient(135deg,#0757c9,#1680ed);
  padding:38px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:38px;
}

header p{
  margin:12px 0 0;
  color:#e5f1ff;
  font-size:17px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 15px;
}

.search{
  width:100%;
  padding:16px;
  border:2px solid #438fff;
  border-radius:12px;
  background:#15181d;
  color:#fff;
  font-size:17px;
  outline:none;
  margin-bottom:25px;
}

.search::placeholder{
  color:#8d98a8;
}

.title{
  color:#58aaff;
  font-size:25px;
  margin:25px 0 14px;
}

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.category{
  border:0;
  background:#1d293b;
  color:#fff;
  padding:11px 15px;
  border-radius:9px;
  cursor:pointer;
  font-size:15px;
}

.category:hover,
.category.active{
  background:#1769e0;
}

.stats{
  margin:25px 0 15px;
  color:#aeb9c8;
}

.games{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(250px,1fr));
  gap:18px;
}

.game{
  background:#15181d;
  border:1px solid #303743;
  border-radius:15px;
  padding:20px;
}

.game:hover{
  border-color:#4a98ff;
}

.game h3{
  color:#58aaff;
  font-size:21px;
  line-height:1.35;
  margin:12px 0 18px;
}

.badge{
  display:inline-block;
  background:#29456e;
  padding:7px 11px;
  border-radius:8px;
  font-size:13px;
}

.view{
  display:inline-block;
  background:#1769e0;
  color:#fff;
  text-decoration:none;
  padding:11px 15px;
  border-radius:9px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:50px 10px;
  color:#9da7b5;
}

footer{
  text-align:center;
  color:#777f8b;
  padding:50px 15px;
  line-height:1.7;
}

@media(max-width:600px){

  header h1{
    font-size:30px;
  }

  header p{
    font-size:15px;
  }

  .games{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>

  <h1>🎮 All Console Games</h1>

  <p>
    PlayStation • Nintendo • Atari • Sega • Retro • Arcade
  </p>

</header>


<div class="container">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search games..."
  >


  <!-- PLAYSTATION -->

  <h2 class="title">🎮 PlayStation</h2>

  <div class="categories">

    <button class="category"
      onclick="filterGames('PS1')">
      PS1
    </button>

    <button class="category"
      onclick="filterGames('PS2')">
      PS2
    </button>

    <button class="category"
      onclick="filterGames('PS3')">
      PS3
    </button>

    <button class="category"
      onclick="filterGames('PS4')">
      PS4
    </button>

    <button class="category"
      onclick="filterGames('PS5')">
      PS5
    </button>

    <button class="category"
      onclick="filterGames('PSP')">
      PSP
    </button>

  </div>


  <!-- NINTENDO -->

  <h2 class="title">🕹️ Nintendo</h2>

  <div class="categories">

    <button class="category"
      onclick="filterGames('GameCube')">
      GameCube
    </button>

    <button class="category"
      onclick="filterGames('Nintendo 64')">
      Nintendo 64
    </button>

    <button class="category"
      onclick="filterGames('SNES')">
      Super Nintendo
    </button>

    <button class="category"
      onclick="filterGames('NES')">
      NES
    </button>

    <button class="category"
      onclick="filterGames('Wii')">
      Wii
    </button>

    <button class="category"
      onclick="filterGames('Wii U')">
      Wii U
    </button>

    <button class="category"
      onclick="filterGames('WiiWare')">
      WiiWare
    </button>

    <button class="category"
      onclick="filterGames('3DS')">
      3DS
    </button>

    <button class="category"
      onclick="filterGames('Nintendo DS')">
      Nintendo DS
    </button>

    <button class="category"
      onclick="filterGames('Virtual Console')">
      Virtual Console
    </button>

  </div>


  <!-- ATARI -->

  <h2 class="title">🕹️ Atari</h2>

  <div class="categories">

    <button class="category"
      onclick="filterGames('Atari 2600')">
      Atari 2600
    </button>

    <button class="category"
      onclick="filterGames('Atari Lynx')">
      Atari Lynx
    </button>

    <button class="category"
      onclick="filterGames('Atari Jaguar')">
      Atari Jaguar
    </button>

  </div>


  <!-- RETRO -->

  <h2 class="title">🎮 Retro & Other</h2>

  <div class="categories">

    <button class="category"
      onclick="filterGames('Game Boy Color')">
      Game Boy Color
    </button>

    <button class="category"
      onclick="filterGames('Game Boy Advance')">
      Game Boy Advance
    </button>

    <button class="category"
      onclick="filterGames('Dreamcast')">
      Dreamcast
    </button>

    <button class="category"
      onclick="filterGames('MAME')">
      MAME
    </button>

    <button class="category"
      onclick="filterGames('Vectrex')">
      Vectrex
    </button>

    <button class="category"
      onclick="filterGames('Commodore Amiga')">
      Commodore Amiga
    </button>

    <button class="category"
      onclick="filterGames('TurboGrafx 16')">
      TurboGrafx 16
    </button>

  </div>


  <div class="stats" id="stats">
    Select a category
  </div>


  <div id="games" class="games"></div>

</div>


<footer>

  © 2026 All Console Games<br>
  Game Information & Reviews

</footer>


<script>

const games = [

  {
    name:"James Bond 007: Agent Under Fire",
    console:"PS2"
  },

  {
    name:"007: Everything or Nothing",
    console:"PS2"
  },

  {
    name:"007: From Russia with Love",
    console:"PS2"
  },

  {
    name:"007: Nightfire",
    console:"PS2"
  },

  {
    name:"007: Quantum of Solace",
    console:"PS2"
  },

  {
    name:"25 to Life",
    console:"PS2"
  },

  {
    name:"50 Cent: Bulletproof",
    console:"PS2"
  },

  {
    name:"Super Mario 64",
    console:"Nintendo 64"
  },

  {
    name:"The Legend of Zelda: Ocarina of Time",
    console:"Nintendo 64"
  },

  {
    name:"Super Mario World",
    console:"SNES"
  },

  {
    name:"Contra",
    console:"NES"
  },

  {
    name:"Sonic Adventure",
    console:"Dreamcast"
  },

  {
    name:"Pac-Man",
    console:"MAME"
  }

];


let selectedConsole = "";
let searchTerm = "";


function displayGames(){

  const box =
    document.getElementById("games");

  box.innerHTML = "";


  const results = games.filter(game => {

    const consoleOK =
      selectedConsole === "" ||
      game.console === selectedConsole;

    const searchOK =
      searchTerm === "" ||
      game.name
        .toLowerCase()
        .includes(searchTerm) ||
      game.console
        .toLowerCase()
        .includes(searchTerm);

    return consoleOK && searchOK;

  });


  document.getElementById("stats").textContent =
    results.length + " games found";


  if(results.length === 0){

    box.innerHTML =
      '<div class="empty">No games found.</div>';

    return;

  }


  results.forEach(game => {

    const card =
      document.createElement("div");

    card.className = "game";


    const detailsURL =
      "game.html?name=" +
      encodeURIComponent(game.name) +
      "&platform=" +
      encodeURIComponent(game.console);


    card.innerHTML = `

      <span class="badge">
        ${game.console}
      </span>

      <h3>
        ${game.name}
      </h3>

      <a
        class="view"
        href="${detailsURL}">
        View Details →
      </a>

    `;


    box.appendChild(card);

  });

}


function filterGames(consoleName){

  selectedConsole = consoleName;

  displayGames();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


document
  .getElementById("search")
  .addEventListener("input", function(){

    searchTerm =
      this.value.toLowerCase().trim();

    displayGames();

  });


displayGames();

</script>

</body>
</html>
